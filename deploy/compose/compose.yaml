# ─────────────────────────────────────────────────────────────────────────────
# Euron Open VoiceOS: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4510   api 4530   runtime 4535   speech 4537   mock providers 4550
#   postgres 4542   redis 4579   floci 4566   TURN 4578 (+ UDP relay 4581 to 4589)
# ─────────────────────────────────────────────────────────────────────────────
name: voiceos

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  VOICEOS_CLOUD: local
  LOG_LEVEL: ${VOS_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://voiceos:voiceos@postgres:5432/voiceos
  # Redis is optional. Set VOS_REDIS_URL= (empty) in .env to run without it.
  REDIS_URL: ${VOS_REDIS_URL-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  RUNTIME_TOKEN_SECRET: ${RUNTIME_TOKEN_SECRET:?run `make env` first}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api and /v1 with X-Forwarded-For; trust it on the
  # Compose network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${VOS_WEB_PORT:-4510},http://127.0.0.1:${VOS_WEB_PORT:-4510}
  # Browsers reach the runtime on the published port; the worker uses the Compose network.
  RUNTIME_PUBLIC_URL: http://localhost:${VOS_RUNTIME_PORT:-4535}
  RUNTIME_INTERNAL_URL: http://runtime:8080
  VOS_DEMO_PASSWORD: ${VOS_DEMO_PASSWORD:?run `make env` first}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: voiceos
      POSTGRES_USER: voiceos
      POSTGRES_PASSWORD: voiceos
    ports:
      - "127.0.0.1:${VOS_PG_PORT:-4542}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceos -d voiceos"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Agent config version stamp, SDK key rate limits, the TTS phrase cache across runtime
  # replicas. Optional: losing it costs cache hits, never correctness.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${VOS_REDIS_PORT:-4579}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: fetch Whisper and Kokoro into the models volume (checksummed). Fast on reruns.
  models:
    build:
      <<: *server-build
      target: speech
    image: voiceos-speech:local
    command: ["models", "--dir", "/models", "--whisper", "${VOS_WHISPER_DOWNLOAD:-tiny,base,small}"]
    volumes:
      - models:/models
    healthcheck:
      disable: true
    restart: "no"

  # Local speech recognition (Whisper) and synthesis (Kokoro), OpenAI-compatible.
  speech:
    image: voiceos-speech:local
    command: ["speech", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      LOG_LEVEL: ${VOS_LOG_LEVEL:-INFO}
      SPEECH_MODELS_DIR: /models
      WHISPER_PRELOAD: ${VOS_WHISPER_PRELOAD:-base}
      SPEECH_CONCURRENCY: ${VOS_SPEECH_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${VOS_SPEECH_PORT:-4537}:8080"
    volumes:
      - models:/models:ro
    read_only: true
    tmpfs:
      # exec: Kokoro's phonemizer copies libespeak-ng into /tmp and loads it from there,
      # which a default (noexec) tmpfs refuses. Only this service needs it.
      - /tmp:exec,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    depends_on:
      models:
        condition: service_completed_successfully
    restart: unless-stopped

  # Deterministic stand-ins for cloud LLM, STT and TTS, with failure injection.
  # What each stage received: GET http://localhost:4550/stats
  mock-providers:
    build:
      <<: *server-build
      target: api
    image: voiceos-api:local
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockproviders.app:app", "--host", "0.0.0.0", "--port", "4550"]
    ports:
      - "127.0.0.1:${VOS_MOCK_PORT:-4550}:4550"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4550/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # TURN relay so WebRTC works from a browser on the host to the runtime in Docker.
  # Credentials are short-lived HMACs of TURN_SECRET (coturn use-auth-secret), minted per
  # session by the runtime; no static TURN password exists.
  turn:
    image: coturn/coturn:4.6.3
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?run `make env` first}
      - --realm=voiceos.local
      - --min-port=4581
      - --max-port=4589
      - --external-ip=127.0.0.1
      - --allow-loopback-peers
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout
    ports:
      - "127.0.0.1:${VOS_TURN_PORT:-4578}:3478/udp"
      - "127.0.0.1:${VOS_TURN_PORT:-4578}:3478/tcp"
      - "127.0.0.1:4581-4589:4581-4589/udp"
    restart: unless-stopped

  # One-shot: apply Alembic migrations before anything that reads the schema starts.
  migrate:
    image: voiceos-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mock-providers:
        condition: service_started
    restart: "no"

  api:
    image: voiceos-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${VOS_API_PORT:-4530}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  runtime:
    build:
      <<: *server-build
      target: runtime
    image: voiceos-runtime:local
    command: ["runtime", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${VOS_LOG_LEVEL:-INFO}
      PORT: "8080"
      CONTROL_PLANE_URL: http://api:8080
      RUNTIME_TOKEN_SECRET: ${RUNTIME_TOKEN_SECRET:?run `make env` first}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run `make env` first}
      MAX_SESSIONS: ${VOS_MAX_SESSIONS:-8}
      ALLOWED_ORIGINS: http://localhost:${VOS_WEB_PORT:-4510},http://127.0.0.1:${VOS_WEB_PORT:-4510}
      ICE_URLS: turn:127.0.0.1:${VOS_TURN_PORT:-4578}?transport=udp
      # The runtime reaches the same TURN server on the Compose network.
      SERVER_ICE_URLS: turn:turn:3478?transport=udp
      TURN_PASSWORD: ${TURN_SECRET:?run `make env` first}
    ports:
      - "127.0.0.1:${VOS_RUNTIME_PORT:-4535}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
      speech:
        condition: service_healthy
    restart: unless-stopped

  # Retention purge and benchmark runs. Built from the runtime image: benchmarks hold real
  # voice sessions, which needs Pipecat's frame format.
  worker:
    image: voiceos-runtime:local
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: voiceos-web:local
    environment:
      # Server-side only: Next rewrites /api/* and /v1/* to the API on the Compose
      # network, so the browser talks to one origin (no CORS, first-party cookies).
      API_INTERNAL_URL: http://api:8080
      # The browser connects to the runtime directly; the CSP allows exactly this origin.
      RUNTIME_PUBLIC_URL: http://localhost:${VOS_RUNTIME_PORT:-4535}
      PORT: "8080"
    ports:
      - "127.0.0.1:${VOS_WEB_PORT:-4510}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  objects:
  models:
