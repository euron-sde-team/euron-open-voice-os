<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open VoiceOS</title>
  <desc id="d">Voice agents you run yourself, measured on every turn: a self-hosted real-time voice agent platform</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a1a"/>
      <stop offset="1" stop-color="#160f2b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#f3efff" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open VoiceOS</text>
    <text x="74" y="186" fill="#b8a9e0" font-size="22" font-weight="400">Voice agents you run yourself, measured on every turn.</text>
    <text x="74" y="246" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9a8cc4" xml:space="preserve">local Whisper and Kokoro<tspan fill="#3b2f63">  /  </tspan>any provider per stage<tspan fill="#3b2f63">  /  </tspan>latency and cost per turn<tspan fill="#3b2f63">  /  </tspan>private by default</text>
  </g>

  <!-- A voice wave goes into the mark; one turn comes out as its stages -->
  <g transform="translate(860 56)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11">
    <circle cx="170" cy="104" r="118" fill="url(#halo)"/>
    <!-- caller's voice -->
    <g fill="#64748b">
      <rect x="0" y="96" width="6" height="16" rx="3"/>
      <rect x="12" y="82" width="6" height="44" rx="3"/>
      <rect x="24" y="70" width="6" height="68" rx="3"/>
      <rect x="36" y="88" width="6" height="32" rx="3"/>
      <rect x="48" y="76" width="6" height="56" rx="3"/>
      <rect x="60" y="92" width="6" height="24" rx="3"/>
      <rect x="72" y="84" width="6" height="40" rx="3"/>
      <rect x="84" y="98" width="6" height="12" rx="3"/>
    </g>
    <text x="0" y="168" fill="#8478a8">caller speaks</text>
    <path d="M100 104 H136" stroke="#5b4a8a" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- the mark: an audio wave in a rounded square -->
    <rect x="140" y="70" width="68" height="68" rx="20" fill="url(#mark)"/>
    <g fill="#ffffff">
      <rect x="153" y="99" width="5" height="10" rx="2.5" fill-opacity="0.6"/>
      <rect x="162" y="90" width="5" height="28" rx="2.5" fill-opacity="0.85"/>
      <rect x="171" y="82" width="5" height="44" rx="2.5"/>
      <rect x="180" y="92" width="5" height="24" rx="2.5" fill-opacity="0.85"/>
      <rect x="189" y="99" width="5" height="10" rx="2.5" fill-opacity="0.6"/>
    </g>
    <path d="M212 104 H238" stroke="#a78bfa" stroke-width="2"/>
    <!-- one turn, by stage -->
    <rect x="244" y="74" width="34" height="10" rx="5" fill="#94a3b8"/>
    <rect x="278" y="74" width="26" height="10" rx="0" fill="#7c3aed"/>
    <rect x="304" y="74" width="40" height="10" rx="5" fill="#db2777"/>
    <rect x="244" y="90" width="44" height="6" rx="3" fill="#0891b2"/>
    <text x="244" y="118" fill="#c4b5fd">end of turn, LLM, TTS</text>
    <text x="244" y="136" fill="#67e8f9">speech to text</text>
    <text x="244" y="160" fill="#f9a8d4">cost per session</text>
  </g>
</svg>
