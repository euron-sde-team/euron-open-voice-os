<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">The stages of one turn</title>
  <desc id="d">A timeline of one turn. The caller speaks; at the end of their speech (Silero VAD) the clock starts. End of turn runs until the turn is declared over, while speech to text runs in parallel. Then the language model produces its first token, then text to speech produces its first audio, and the agent starts speaking. The response time a caller feels runs from the end of their speech to the agent's first audio.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#f6f5fa"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">
    <text x="40" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">ONE TURN, AS THE TURN RECORDER MEASURES IT</text>

    <!-- caller speech -->
    <text x="40" y="96" font-size="13" font-weight="600">Caller</text>
    <g fill="#64748b">
      <rect x="140" y="84" width="6" height="16" rx="3"/><rect x="152" y="78" width="6" height="28" rx="3"/>
      <rect x="164" y="72" width="6" height="40" rx="3"/><rect x="176" y="80" width="6" height="24" rx="3"/>
      <rect x="188" y="74" width="6" height="36" rx="3"/><rect x="200" y="82" width="6" height="20" rx="3"/>
      <rect x="212" y="76" width="6" height="32" rx="3"/><rect x="224" y="84" width="6" height="16" rx="3"/>
      <rect x="236" y="80" width="6" height="24" rx="3"/><rect x="248" y="86" width="6" height="12" rx="3"/>
    </g>

    <!-- t0 line -->
    <path d="M262 60 V270" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="268" y="70" font-size="12" font-weight="600" fill="#334155">end of speech (VAD)</text>

    <!-- stages -->
    <text x="40" y="146" font-size="13" font-weight="600">Agent</text>
    <rect x="262" y="132" width="220" height="22" rx="6" fill="#94a3b8"/>
    <text x="274" y="148" font-size="12.5" font-weight="600" fill="#fff">end of turn</text>
    <rect x="482" y="132" width="150" height="22" rx="0" fill="#7c3aed"/>
    <text x="494" y="148" font-size="12.5" font-weight="600" fill="#fff">LLM first token</text>
    <rect x="632" y="132" width="190" height="22" rx="6" fill="#db2777"/>
    <text x="644" y="148" font-size="12.5" font-weight="600" fill="#fff">TTS first audio</text>
    <rect x="822" y="132" width="40" height="22" rx="6" fill="#cbd5e1"/>
    <text x="870" y="148" font-size="12" fill="#64748b">transport and playout</text>

    <rect x="262" y="166" width="200" height="12" rx="6" fill="#0891b2"/>
    <text x="474" y="177" font-size="12" fill="#0e7490">speech to text, in parallel with end of turn</text>

    <!-- agent audio -->
    <g fill="#7c3aed">
      <rect x="866" y="196" width="6" height="16" rx="3"/><rect x="878" y="190" width="6" height="28" rx="3"/>
      <rect x="890" y="186" width="6" height="36" rx="3"/><rect x="902" y="192" width="6" height="24" rx="3"/>
      <rect x="914" y="188" width="6" height="32" rx="3"/><rect x="926" y="196" width="6" height="16" rx="3"/>
    </g>
    <text x="946" y="208" font-size="12" fill="#5b21b6">agent speaks</text>

    <!-- response time -->
    <path d="M266 240 H858" stroke="#334155" stroke-width="1.6" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="440" y="262" font-size="13" font-weight="600" fill="#334155">response_ms: what the caller feels</text>

    <!-- legend -->
    <text x="40" y="306" font-size="12" fill="#64748b">endpoint_ms: end of speech to turn over. stt_ms: end of speech to transcript. llm_first_token_ms: turn over and transcript in, to first token.</text>
    <text x="40" y="324" font-size="12" fill="#64748b">tts_first_audio_ms: first token to first audio. A stage that did not run is not reported, never zero.</text>
  </g>
</svg>
