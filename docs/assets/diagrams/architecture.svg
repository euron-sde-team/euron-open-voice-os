<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">VoiceOS architecture</title>
  <desc id="d">Callers use the dashboard's Talk page or your app. The dashboard and your backend ask the VoiceOS API for a session ticket. The browser connects to the voice runtime over WebRTC, through the TURN relay, or over WebSocket. The runtime loads the agent from the API, runs speech to text, the language model and text to speech with self-hosted or hosted providers, and reports the finished session back. The API stores sessions in Postgres, uses Redis for invalidation and rate limits, and seals provider keys with KMS. A worker purges expired transcripts and runs benchmarks.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="620" rx="16" fill="#f6f5fa"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- clients -->
    <text x="40" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">CALLERS AND YOUR APPS</text>
    <g filter="url(#s)">
      <rect x="40" y="62" width="230" height="72" rx="12" fill="#fff"/>
      <rect x="40" y="152" width="230" height="72" rx="12" fill="#fff"/>
    </g>
    <text x="58" y="92" font-size="15" font-weight="600">Dashboard (Talk page)</text>
    <text x="58" y="113" font-size="12.5" fill="#64748b">Next.js, Pipecat client</text>
    <text x="58" y="182" font-size="15" font-weight="600">Your app</text>
    <text x="58" y="203" font-size="12.5" fill="#64748b">backend: SDK key; browser: Pipecat</text>

    <!-- api -->
    <g filter="url(#s)"><rect x="340" y="62" width="330" height="170" rx="16" fill="#fff"/></g>
    <rect x="340" y="62" width="330" height="6" rx="3" fill="#6d28d9"/>
    <text x="362" y="98" font-size="16" font-weight="650">VoiceOS API (control plane)</text>
    <text x="362" y="118" font-size="12.5" fill="#64748b">FastAPI, stateless, N replicas</text>
    <text x="362" y="146" font-size="12.5" fill="#334155">session tickets (60 s, single use)</text>
    <text x="362" y="166" font-size="12.5" fill="#334155">agents, providers (sealed keys), SDK keys</text>
    <text x="362" y="186" font-size="12.5" fill="#334155">reports: cost, redaction, retention, rollups</text>
    <text x="362" y="206" font-size="12.5" fill="#334155">dashboard API, audit log</text>
    <path d="M270 98 H336" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M270 188 C 300 188, 300 140, 336 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="276" y="88" font-size="11" fill="#64748b">ticket</text>

    <!-- runtime -->
    <g filter="url(#s)"><rect x="340" y="300" width="330" height="190" rx="16" fill="#fff"/></g>
    <rect x="340" y="300" width="330" height="6" rx="3" fill="#7c3aed"/>
    <text x="362" y="336" font-size="16" font-weight="650">Voice runtime (Pipecat)</text>
    <text x="362" y="356" font-size="12.5" fill="#64748b">one pipeline per call, no database</text>
    <rect x="362" y="372" width="286" height="34" rx="8" fill="#f1ecfd"/>
    <text x="376" y="394" font-size="12.5" font-weight="600" fill="#5b21b6">VAD + turns, STT, router, LLM, TTS</text>
    <text x="362" y="430" font-size="12.5" fill="#334155">turn recorder: every stage timed</text>
    <text x="362" y="450" font-size="12.5" fill="#334155">phrase cache, response cache, small model</text>
    <text x="362" y="470" font-size="12.5" fill="#334155">fallbacks when a provider fails</text>

    <!-- browser to runtime -->
    <path d="M155 224 V 395 H336" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#v)"/>
    <text x="168" y="386" font-size="11.5" fill="#6d28d9">WebSocket, or WebRTC media</text>
    <g filter="url(#s)"><rect x="40" y="440" width="230" height="64" rx="12" fill="#fff"/></g>
    <text x="58" y="468" font-size="14.5" font-weight="600">TURN relay (coturn)</text>
    <text x="58" y="488" font-size="12" fill="#64748b">UDP relay, per-call credentials</text>
    <path d="M270 472 H 300 V 440 H336" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#v)"/>

    <!-- runtime and api -->
    <path d="M470 300 V236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M540 236 V296" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="400" y="272" font-size="11" fill="#64748b">report</text>
    <text x="548" y="272" font-size="11" fill="#64748b">agent (internal token)</text>

    <!-- providers -->
    <text x="760" y="300" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">PROVIDERS, PER STAGE AND AGENT</text>
    <g filter="url(#s)">
      <rect x="760" y="318" width="400" height="72" rx="12" fill="#fff"/>
      <rect x="760" y="404" width="400" height="72" rx="12" fill="#fff"/>
    </g>
    <text x="778" y="346" font-size="14.5" font-weight="600">Speech server (self-hosted)</text>
    <text x="778" y="366" font-size="12" fill="#64748b">faster-whisper STT, Kokoro TTS, OpenAI-compatible</text>
    <text x="778" y="432" font-size="14.5" font-weight="600">Any OpenAI-compatible LLM, or a hosted API</text>
    <text x="778" y="452" font-size="12" fill="#64748b">Ollama, vLLM; Deepgram, Sarvam, Anthropic, ElevenLabs, Cartesia</text>
    <path d="M670 360 H756" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#v)"/>
    <path d="M670 440 H756" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#v)"/>

    <!-- data -->
    <text x="760" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">DATA (AWS ON TERRAFORM, FLOCI LOCALLY)</text>
    <g filter="url(#s)">
      <rect x="760" y="62" width="190" height="60" rx="12" fill="#fff"/>
      <rect x="970" y="62" width="190" height="60" rx="12" fill="#fff"/>
      <rect x="760" y="138" width="190" height="60" rx="12" fill="#fff"/>
      <rect x="970" y="138" width="190" height="60" rx="12" fill="#fff"/>
    </g>
    <text x="778" y="88" font-size="14" font-weight="600">PostgreSQL</text>
    <text x="778" y="107" font-size="11.5" fill="#64748b">sessions, turns, rollups</text>
    <text x="988" y="88" font-size="14" font-weight="600">Redis (optional)</text>
    <text x="988" y="107" font-size="11.5" fill="#64748b">invalidation, rate limits</text>
    <text x="778" y="164" font-size="14" font-weight="600">KMS</text>
    <text x="778" y="183" font-size="11.5" fill="#64748b">seals provider keys</text>
    <text x="988" y="164" font-size="14" font-weight="600">Worker</text>
    <text x="988" y="183" font-size="11.5" fill="#64748b">retention purge, benchmarks</text>
    <path d="M670 120 H756" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M670 170 H756" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- footer -->
    <text x="40" y="580" font-size="12.5" fill="#64748b">No audio is stored. Transcripts are redacted and expire per agent. External providers are disclosed before the call.</text>
  </g>
</svg>
